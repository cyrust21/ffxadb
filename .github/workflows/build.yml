name: Build Native C++ (Gradle Minimal)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5 # Diperbarui ke v5 agar tidak ada warning
        with:
          distribution: 'temurin'
          java-version: '17' 

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7' # INI KUNCI PERBAIKANNYA: Mengunci versi Gradle ke 8.7

      - name: Build with Gradle
        run: |
          # Terima semua lisensi Android SDK agar tidak error
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          
          # Gunakan perintah gradle (tanpa ./gradlew) karena ini repo baru
          gradle assembleDebug

      - name: Extract Native Binaries
        run: |
          mkdir -p native_output
          
          # Mencari semua file berakhiran .so di hasil build
          find build/intermediates -type f -name "*.so" -exec cp {} native_output/ \;

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ffx-native-binaries
          path: native_output/
          compression-level: 9
