name: Build Native C++ (Gradle Minimal)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17' 

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7' 

      - name: Build with Gradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          
          # Karena tidak ada gradlew, kita pakai gradle bawaan server
          gradle assembleDebug

      - name: Extract Native Binaries
        run: |
          mkdir -p native_output
          find build/intermediates -type f -name "*.so" -exec cp {} native_output/ \;

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ffx-native-binaries
          path: native_output/
          compression-level: 9
